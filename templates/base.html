{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description"
              content="{% block meta_description %}Request, manage, and track campus equipment loans.{% endblock %}">
        <meta name="application-name" content="Campus Equipment Borrowing System">
        <meta name="theme-color" content="#047857">
        <title>{% block title %}Campus Equipment Borrowing System{% endblock %}</title>
        <link rel="icon"
              href="{% static 'images/favicon/favicon.ico' %}"
              sizes="any">
        <link rel="icon"
              type="image/png"
              sizes="32x32"
              href="{% static 'images/favicon/favicon-32x32.png' %}">
        <link rel="icon"
              type="image/png"
              sizes="16x16"
              href="{% static 'images/favicon/favicon-16x16.png' %}">
        <link rel="apple-touch-icon"
              sizes="180x180"
              href="{% static 'images/favicon/apple-touch-icon.png' %}">
        <link rel="manifest" href="{% static 'images/favicon/site.webmanifest' %}">
        <link rel="stylesheet" href="{% static 'build/app.css' %}">
        {% block extra_head %}{% endblock %}
    </head>
    <body class="font-sans antialiased">
        {% block content %}{% endblock %}
        {% block scripts %}{% endblock %}
    </body>
</html>
