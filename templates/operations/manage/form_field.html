<div class="min-w-0">
    <label for="{{ field.id_for_label }}"
           class="mb-2 block text-sm font-medium">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}
        <p id="{{ field.auto_id }}_helptext"
           class="mt-2 text-sm text-slate-500">{{ field.help_text }}</p>
    {% endif %}
    {% if field.errors %}<div class="mt-2 text-sm text-rose-700">{{ field.errors }}</div>{% endif %}
</div>
