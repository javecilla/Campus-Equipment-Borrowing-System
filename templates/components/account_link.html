<a href="{% url profile_route %}"
   class="ui-account-link"
   aria-label="View profile for {{ request.user.get_full_name|default:request.user.username }}"
   data-testid="nav-account-profile"
   {% if request.resolver_match.url_name == 'profile' %}aria-current="page"{% endif %}>
    {% include "components/profile_avatar.html" with avatar_class="h-8 w-8 shrink-0" %}
    <span class="min-w-0">
        <span class="block truncate text-xs font-semibold text-slate-900"
              data-testid="account-display-name">
            {% include "components/account_name.html" %}
        </span>
        <span class="block text-xs text-slate-500">{{ request.user.get_role_display }}</span>
    </span>
</a>
