<form method="post" action="{% url 'accounts:logout' %}">
    {% csrf_token %}
    <button type="submit"
            data-testid="logout-submit"
            class="inline-flex min-h-11 items-center gap-2 rounded-md px-3 text-sm font-medium text-slate-600 transition-colors hover:bg-slate-50 hover:text-slate-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
        Log out
        <svg xmlns="http://www.w3.org/2000/svg"
             width="16"
             height="16"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="1.5"
             stroke-linecap="round"
             stroke-linejoin="round"
             aria-hidden="true"
             focusable="false">
            <path d="M9 5H5v14h4M14 8l4 4-4 4M9 12h9" />
        </svg>
    </button>
</form>
