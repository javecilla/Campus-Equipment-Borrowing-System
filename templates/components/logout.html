<form method="post" action="{% url 'accounts:logout' %}">
    {% csrf_token %}
    <button type="submit"
            data-testid="logout-submit"
            class="ui-nav-link ui-nav-link--danger w-full cursor-pointer text-left">
        <svg xmlns="http://www.w3.org/2000/svg"
             class="shrink-0"
             width="20"
             height="20"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="1.5"
             stroke-linecap="round"
             stroke-linejoin="round"
             aria-hidden="true"
             focusable="false">
            <path d="M9 5H5v14h4M14 8l4 4-4 4M9 12h9" />
        </svg>
        Log out
    </button>
</form>
