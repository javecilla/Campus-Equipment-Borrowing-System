<a href="{% url route %}"
   data-testid="{{ testid }}"
   {% if current == section %}aria-current="page"{% endif %}
   class="ui-nav-link">
    {% include "components/icon.html" with icon=section only %}
    {{ label }}
    {% if badge %}
        <span class="ui-nav-badge"
              data-testid="{{ testid }}-badge"
              aria-label="{{ badge }} pending request{{ badge|pluralize }}">
            {% if badge > 99 %}99+{% else %}{{ badge }}{% endif %}
        </span>
    {% endif %}
</a>
