{% extends "accounts/portal/base.html" %}
{% block title %}My requests · Campus Equipment{% endblock %}
{% block workspace_content %}
    <section data-testid="request-list-page"
             aria-labelledby="request-list-heading"
             class="max-w-3xl">
        <p class="text-xs font-semibold tracking-widest text-accent uppercase">Borrower workspace</p>
        <h1 id="request-list-heading"
            class="mt-2 font-heading text-3xl font-semibold">My requests</h1>
        <p class="mt-3 text-sm leading-6 text-slate-600">
            Request history, status details, loan tracking, and cancellation are part of T12.
        </p>
        <a href="{% url 'portal:request-create' %}"
           data-testid="request-create-link"
           class="mt-6 inline-flex h-11 items-center rounded-md bg-accent px-5 text-sm font-semibold text-white transition-colors hover:bg-emerald-800 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent">Create a request</a>
    </section>
{% endblock %}
